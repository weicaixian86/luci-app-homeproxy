name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（例如 v2.0.54 或 V2.0.54，只去掉开头的 v/V）"
        required: true
        type: string
      description:
        description: "Release 描述（可选，默认留空）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenWrt 24.10.0 IPK
            sdk_url: https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            output: ipk
          - name: OpenWrt 25.12.0 APK
            sdk_url: https://downloads.openwrt.org/releases/25.12.0/targets/x86/64/openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            output: apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zstd

      - name: Locate package source directory
        id: pkgdir
        run: |
          set -e
          makefile="$(mktemp)"
          found=""
          while IFS= read -r candidate; do
            tr -d '\r' <"$candidate" >"$makefile"
            if grep -q '^PKG_NAME:=luci-app-homeproxy[[:space:]]*$' "$makefile"; then
              found="$(cd "$(dirname "$candidate")" && pwd)"
              break
            fi
          done < <(find . -name Makefile -type f)
          if [ -z "$found" ]; then
            echo "::error::no Makefile with PKG_NAME:=luci-app-homeproxy found"
            exit 1
          fi
          echo "dir=$found" >>"$GITHUB_OUTPUT"
          echo "package source directory: $found"

      - name: Update package version from tag
        run: |
          set -e
          pkg_dir="${{ steps.pkgdir.outputs.dir }}"
          tag="${{ inputs.tag }}"
          # Only strip a leading v/V; keep the rest of the tag verbatim.
          version="${tag#v}"
          version="${version#V}"
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$version/" "$pkg_dir/Makefile"
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" "$pkg_dir/Makefile"
          grep -E '^PKG_(VERSION|RELEASE):=' "$pkg_dir/Makefile"

      - name: Download and extract SDK
        run: |
          set -e
          full="${{ matrix.sdk_url }}"
          # Every OpenWrt mirror serves the identical SDK path; try each one
          # until one answers. downloads.openwrt.org frequently returns 503 to
          # CI runners, so it is only one candidate among several.
          sdk_rel="${full#*downloads.openwrt.org}"
          MIRRORS="https://mirror-03.infra.openwrt.org https://mirrors.kernel.org/openwrt https://ftp.halifax.rwth-aachen.de/openwrt https://downloads.openwrt.org https://openwrt.proxy.ustclug.org https://mirrors.ustc.edu.cn/openwrt https://mirrors.tuna.tsinghua.edu.cn/openwrt"
          got=0
          for base in $MIRRORS; do
            url="${base}${sdk_rel}"
            echo "-> trying SDK mirror: $url"
            if curl -fsSL --http1.1 --connect-timeout 30 --max-time 900 \
                 --retry 3 --retry-delay 5 --retry-all-errors \
                 "$url" -o sdk.tar.zst; then
              echo "downloaded from $base"
              got=1
              break
            fi
            echo "failed from $base, trying next mirror"
            rm -f sdk.tar.zst
          done
          [ "$got" = "1" ] || { echo "::error::all SDK mirrors failed"; exit 1; }
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Build package
        working-directory: sdk
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install luci
          cp -r "${{ steps.pkgdir.outputs.dir }}" package/luci-app-homeproxy
          # Ensure service and runtime scripts keep their executable bit even when
          # committed from a Windows checkout (git may drop the mode).
          chmod 0755 package/luci-app-homeproxy/root/etc/init.d/* \
                     package/luci-app-homeproxy/root/etc/homeproxy/scripts/* 2>/dev/null || true
          echo "CONFIG_PACKAGE_luci-app-homeproxy=m" >> .config
          # Fall back to OpenWrt mirrors when downloads.openwrt.org 503s while
          # fetching package sources during the build.
          echo 'CONFIG_DOWNLOAD_MIRRORS="https://mirror-03.infra.openwrt.org https://mirrors.kernel.org/openwrt https://ftp.halifax.rwth-aachen.de/openwrt https://mirrors.tuna.tsinghua.edu.cn/openwrt"' >> .config
          make defconfig
          grep -E '^CONFIG_PACKAGE_luci-app-homeproxy=' .config
          # --- Inject the Simplified Chinese catalog into the single main package.
          #     luci.mk ALWAYS builds a *separate* luci-i18n-homeproxy-zh-cn
          #     subpackage that contains homeproxy.zh-cn.lmo (see the po2lmo
          #     invocation in the build log: it compiles po/zh_Hans/homeproxy.po
          #     into .../luci-i18n-homeproxy-zh-cn/usr/lib/lua/luci/i18n/
          #     homeproxy.zh-cn.lmo). We publish only the arch-independent main
          #     package, so we lift that .lmo out of luci.mk's i18n subpackage
          #     build dir and copy it into the main package's root/ tree, then
          #     rebuild the main package so luci.mk's own Build/Prepare re-copies
          #     root/ (now holding the .lmo) into the package payload.
          #     We REUSE the .lmo luci.mk already generated rather than invoking
          #     po2lmo ourselves: on this SDK po2lmo is only on the build's PATH
          #     transiently and is NOT reliably installed to staging_dir/host/bin,
          #     so locating/invoking it directly is fragile (it previously aborted
          #     the build with "po2lmo host tool not found").
          make package/luci-app-homeproxy/compile V=s -j"$(nproc)"
          LMO="$(find build_dir -name 'homeproxy.zh-cn.lmo' | head -n1)"
          [ -n "$LMO" ] || { echo "::error::homeproxy.zh-cn.lmo not found in build_dir"; exit 1; }
          mkdir -p package/luci-app-homeproxy/root/usr/lib/lua/luci/i18n
          cp -f "$LMO" package/luci-app-homeproxy/root/usr/lib/lua/luci/i18n/homeproxy.zh-cn.lmo
          ls -l package/luci-app-homeproxy/root/usr/lib/lua/luci/i18n/
          # Rebuild only the main package so Build/Prepare re-copies root/ in.
          make package/luci-app-homeproxy/clean
          make package/luci-app-homeproxy/compile V=s -j"$(nproc)"

      - name: Collect artifact
        id: collect
        run: |
          set -e
          tag="${{ inputs.tag }}"
          version="${tag#v}"
          version="${version#V}"
          ext="${{ matrix.output }}"
          out_dir="release_artifacts"
          mkdir -p "$out_dir"
          candidates=$(find sdk/bin -type f -name "luci-app-homeproxy*.${ext}" 2>/dev/null || true)
          count=$(printf '%s\n' "$candidates" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one .${ext} artifact, found ${count}"
            printf '%s\n' "$candidates"
            exit 1
          fi
          src="$(printf '%s\n' "$candidates" | head -n1)"
          dest="${out_dir}/luci-app-homeproxy_${version}-all.${ext}"
          cp -f "$src" "$dest"
          echo "file=$dest" >>"$GITHUB_OUTPUT"
          ls -la "$out_dir"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-homeproxy-${{ matrix.output }}
          path: release_artifacts/*

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Prepare release body
        run: |
          {
            printf '编译时间：%s\n' "$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')"
            if [ -n "${{ inputs.description }}" ]; then
              printf '\n%s\n' "${{ inputs.description }}"
            fi
          } >release_body.md
          # Drop leading/trailing blank lines when the description is empty.
          sed -i -e '/./,$!d' release_body.md
          sed -i -e :a -e '/^\n*$/{$d;N;}; /\n$/ba' release_body.md

      - name: Verify release files
        run: |
          set -e
          tag="${{ inputs.tag }}"
          version="${tag#v}"
          version="${version#V}"
          expected_ipk="release_artifacts/luci-app-homeproxy-ipk/luci-app-homeproxy_${version}-all.ipk"
          expected_apk="release_artifacts/luci-app-homeproxy-apk/luci-app-homeproxy_${version}-all.apk"
          if [ ! -f "$expected_ipk" ] || [ ! -f "$expected_apk" ]; then
            echo "::error::release artifacts missing"
            find release_artifacts -type f
            exit 1
          fi
          # Reject any unexpected extra files in the release artifacts.
          if find release_artifacts -type f ! -name "luci-app-homeproxy_${version}-all.ipk" ! -name "luci-app-homeproxy_${version}-all.apk" | grep -q .; then
            echo "::error::unexpected extra files in release artifacts"
            find release_artifacts -type f
            exit 1
          fi

      - name: Check tag does not exist
        run: |
          set -e
          tag="${{ inputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "::error::git tag ${tag} already exists, refusing to overwrite"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${tag} already exists, refusing to overwrite"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body_path: release_body.md
          files: |
            release_artifacts/luci-app-homeproxy-ipk/*
            release_artifacts/luci-app-homeproxy-apk/*
