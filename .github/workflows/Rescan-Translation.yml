name: Rescan Translation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'luci-app-homeproxy/htdocs/**'
      - 'luci-app-homeproxy/root/**'

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

permissions: write-all

jobs:
  scan:
    # 这是「维护 main」的作业：只在 main 分支上运行。
    # 之前在功能分支上手动 dispatch 会在分支上执行 git commit，工作树干净时
    # git commit 直接返回 1（`nothing to commit`），整个 workflow 变红；
    # 更糟的是它的 `git push -f origin HEAD:main` 会把**功能分支**强推覆盖 main。
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source tree
        uses: actions/checkout@main

      - name: Rescan translation
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq update
          sudo -E apt -yqq install gettext

          # 本仓库 luci-app 文件位于 luci-app-homeproxy/ 子目录下（非仓库根）
          cd luci-app-homeproxy

          curl -LO "https://github.com/openwrt/luci/raw/master/build/i18n-scan.pl"
          curl -LO "https://github.com/openwrt/luci/raw/master/build/i18n-update.pl"
          perl "i18n-scan.pl" . > "po/templates/homeproxy.pot"
          perl "i18n-update.pl" "po"
          find po/ -name '*.po~' -exec rm -f {} \;
          rm -f "i18n-scan.pl" "i18n-update.pl"

      - name: Commit changes
        # 判据写在 shell 里，不再依赖 `env.CHANGE_STAT` 表达式：
        # 通过 $GITHUB_ENV 写入的变量在后续 step 的 shell 里可见，但在
        # `if: ${{ env.X }}` 这类表达式里并不可靠 —— 之前那个 `if:` 也就
        # 形同虚设。这里直接用 git 自己的判断，没有改动就干净退出。
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no PO/POT changes; nothing to commit."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "<github-actions[bot]@users.noreply.github.com>"
          git add .
          git commit -m "chore(po): rescan translation"
          # 不用 -f：这里本来就在 main 上跑，普通 push 就是快进；
          # 万一远端已被别人推进，宁可让作业报红，也不要覆盖别人的提交。
          git push origin HEAD:main
