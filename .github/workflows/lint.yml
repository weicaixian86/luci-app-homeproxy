# Fast quality gate for luci-app-homeproxy.
#
# Everything here runs in well under a minute and needs no OpenWrt SDK, so a
# broken syntax / missing translation / packaging mistake is caught long before
# the multi-architecture build starts. It is deliberately NOT a `needs:` of the
# release workflow: a lint failure shows up as a red check but never blocks a
# release you decided to ship.
#
# The exact same checks run locally via:
#     sh tools/tests/run.sh

name: Lint

on:
  push:
    branches: [ main ]
    paths:
      - 'luci-app-homeproxy/**'
      - 'tools/tests/**'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'luci-app-homeproxy/**'
      - 'tools/tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom >= 27 起要求 Node >= 22（它依赖的 undici 7 用到了 node 22.15+
          # 才有的 zlib zstd 接口，在 Node 20 上 require 直接抛
          # "Cannot read properties of undefined (reading 'bind')"）。用 Node 20
          # 时两个 DOM 测试只能走 SKIP 分支 —— 看着是绿的，其实一次都没跑。
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --quiet --disable-pip-version-check polib pyyaml
          # jsdom 驱动两个真渲染测试（routing 表格 DOM、运行日志页）。版本钉死，
          # 否则 npm 每天可能装到新的 jsdom，把一个环境差异变成红色的 Lint 失败
          # （曾经就是 jsdom 26 的 E('style', [css]) 解析差异导致
          # InvalidCharacterError）。升级前请在本地用同一组合跑
          # tools/tests/{routing_pin,logview_render}.test.cjs 两个测试。
          npm install --no-save --no-package-lock --no-fund --no-audit --loglevel=error jsdom@30.1.3 \
            || echo "::warning::jsdom install failed, the DOM tests will be skipped"

      # 自检脚本本身先在 dash 下解析一遍。它跑在 `sh`（ubuntu 上是 dash）里，
      # 而开发者本地 Git Bash 的 sh 是 bash：进程替换 <(...)、[[ ]] 这类语法
      # 本地全绿，CI 却在解析到那一行时直接 `Syntax error: "(" unexpected`，
      # 前面打印过的 200 多条 OK 全部作废，报错位置还指向无关断言行。
      # 单独一步能把「脚本本身坏了」和「某条断言不通过」彻底区分开。
      - name: Parse the self-check script under dash
        run: dash -n tools/tests/run.sh

      - name: Run checks
        env:
          NODE: node
          PY: python3
        run: sh tools/tests/run.sh

      - name: Report catalog summary
        if: always()
        run: |
          python tools/tests/pocheck.py || true
