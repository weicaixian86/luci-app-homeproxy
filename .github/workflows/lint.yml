# Fast quality gate for luci-app-homeproxy.
#
# Everything here runs in well under a minute and needs no OpenWrt SDK, so a
# broken syntax / missing translation / packaging mistake is caught long before
# the multi-architecture build starts. It is deliberately NOT a `needs:` of the
# release workflow: a lint failure shows up as a red check but never blocks a
# release you decided to ship.
#
# The exact same checks run locally via:
#     sh tools/tests/run.sh

name: Lint

on:
  push:
    branches: [ main ]
    paths:
      - 'luci-app-homeproxy/**'
      - 'tools/tests/**'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'luci-app-homeproxy/**'
      - 'tools/tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --quiet --disable-pip-version-check polib pyyaml
          # jsdom powers the routing-table DOM test; the test skips itself when
          # the module is unavailable, so a transient npm failure cannot turn
          # this job into a false negative.
          npm install --no-save --no-package-lock --no-fund --no-audit --loglevel=error jsdom \
            || echo "::warning::jsdom install failed, the DOM test will be skipped"

      - name: Run checks
        env:
          NODE: node
          PY: python3
        run: sh tools/tests/run.sh

      - name: Report catalog summary
        if: always()
        run: |
          python tools/tests/pocheck.py || true
