name: Build & Release All-in-One

# 一体化构建与发布（只跑这一个 workflow 即覆盖全部安装方式）：
#   - luci job（matrix）：用 OpenWrt SDK 分别编译
#       · OpenWrt 24.10.0 的 .ipk（opkg 安装）
#       · OpenWrt 25.12.0 的 .apk（apk 安装）
#     两者均含中文 lmo；独立产物随 Release 发布，可直接 opkg/apk 安装。
#   - core job（matrix）：clone reF1nd/sing-box @ v1.14.3-reF1nd，打补丁，Go 交叉编译
#     多架构静态内核（amd64 / arm64 / armv7 / mipsle）
#   - package job：
#       · 把 luci .ipk + 各架构内核 + install.sh + README 打包成每架构一个 zip；
#       · 把打补丁内核打包成 sing-box-1.14.3-reF1nd-linux-{amd64,amd64v3,arm64}-musl.tar.gz；
#       · 发到 Release（tag: deploy-<version>），含 zip + 独立 IPK + 独立 APK；
#       · 另发 v1.14.3-reF1nd Release（仅内核 tar.gz），供面板「更新内核」自动下载补丁版。
#
# 触发：手动（workflow_dispatch）填版本号（不需要 v 前缀）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（例如 2.0.0；不需要 v 前缀）"
        required: true
        type: string
      description:
        description: "Release 描述（可选，默认留空）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  # ===========================================================================
  # 1) 编译 luci 包（matrix：24.10 IPK + 25.12 APK，均含中文 lmo）
  # ===========================================================================
  luci:
    name: Build luci ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: IPK (OpenWrt 24.10.0)
            sdk_url: https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ext: ipk
          - name: APK (OpenWrt 25.12.0)
            sdk_url: https://downloads.openwrt.org/releases/25.12.0/targets/x86/64/openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ext: apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zstd

      - name: Locate package source directory
        id: pkgdir
        run: |
          set -e
          makefile="$(mktemp)"
          found=""
          while IFS= read -r candidate; do
            tr -d '\r' <"$candidate" >"$makefile"
            if grep -q '^PKG_NAME:=luci-app-homeproxy[[:space:]]*$' "$makefile"; then
              found="$(cd "$(dirname "$candidate")" && pwd)"
              break
            fi
          done < <(find . -name Makefile -type f)
          if [ -z "$found" ]; then
            echo "::error::no Makefile with PKG_NAME:=luci-app-homeproxy found"
            exit 1
          fi
          echo "dir=$found" >>"$GITHUB_OUTPUT"
          echo "package source directory: $found"

      - name: Update package version from tag
        run: |
          set -e
          pkg_dir="${{ steps.pkgdir.outputs.dir }}"
          version="${{ inputs.tag }}"
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$version/" "$pkg_dir/Makefile"
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" "$pkg_dir/Makefile"
          grep -E '^PKG_(VERSION|RELEASE):=' "$pkg_dir/Makefile"

      - name: Download and extract SDK (${{ matrix.name }})
        run: |
          set -e
          sdk_url="${{ matrix.sdk_url }}"
          sdk_rel="${sdk_url#*downloads.openwrt.org}"
          MIRRORS="https://mirror-03.infra.openwrt.org https://mirrors.kernel.org/openwrt https://ftp.halifax.rwth-aachen.de/openwrt https://downloads.openwrt.org https://openwrt.proxy.ustclug.org https://mirrors.ustc.edu.cn/openwrt https://mirrors.tuna.tsinghua.edu.cn/openwrt"
          got=0
          for base in $MIRRORS; do
            url="${base}${sdk_rel}"
            echo "-> trying SDK mirror: $url"
            if curl -fsSL --http1.1 --connect-timeout 30 --max-time 900 \
                 --retry 3 --retry-delay 5 --retry-all-errors \
                 "$url" -o sdk.tar.zst; then
              echo "downloaded from $base"
              got=1
              break
            fi
            echo "failed from $base, trying next mirror"
            rm -f sdk.tar.zst
          done
          [ "$got" = "1" ] || { echo "::error::all SDK mirrors failed"; exit 1; }
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Build luci package
        working-directory: sdk
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install luci
          cp -r "${{ steps.pkgdir.outputs.dir }}" package/luci-app-homeproxy
          chmod 0755 package/luci-app-homeproxy/root/etc/init.d/* \
                     package/luci-app-homeproxy/root/etc/homeproxy/scripts/* 2>/dev/null || true
          echo "CONFIG_PACKAGE_luci-app-homeproxy=m" >> .config
          echo 'CONFIG_DOWNLOAD_MIRRORS="https://mirror-03.infra.openwrt.org https://mirrors.kernel.org/openwrt https://ftp.halifax.rwth-aachen.de/openwrt https://mirrors.tuna.tsinghua.edu.cn/openwrt"' >> .config
          make defconfig
          grep -E '^CONFIG_PACKAGE_luci-app-homeproxy=' .config
          make package/luci-app-homeproxy/compile V=s -j"$(nproc)"
          # 把编译出的中文 lmo 塞进 root/ 树，重编主包使其随 root/ 一起打包
          LMO="$(find build_dir -name 'homeproxy.zh-cn.lmo' | head -n1)"
          [ -n "$LMO" ] || { echo "::error::homeproxy.zh-cn.lmo not found in build_dir"; exit 1; }
          mkdir -p package/luci-app-homeproxy/root/usr/lib/lua/luci/i18n
          cp -f "$LMO" package/luci-app-homeproxy/root/usr/lib/lua/luci/i18n/homeproxy.zh-cn.lmo
          make package/luci-app-homeproxy/clean
          make package/luci-app-homeproxy/compile V=s -j"$(nproc)"

      - name: Collect ${{ matrix.ext }}
        run: |
          set -e
          ext="${{ matrix.ext }}"
          src="$(find sdk/bin -type f -name "luci-app-homeproxy*.${ext}" | head -n1)"
          [ -n "$src" ] || { echo "::error::luci .${ext} not found"; exit 1; }
          cp -f "$src" "luci-app-homeproxy.${ext}"
          ls -la "luci-app-homeproxy.${ext}"

      - name: Upload luci ${{ matrix.ext }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-${{ matrix.ext }}
          path: luci-app-homeproxy.${{ matrix.ext }}

  # ===========================================================================
  # 2) 编译打补丁的 reF1nd 内核（多架构）
  # ===========================================================================
  core:
    name: Build sing-box ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            goarm: ""
            gomips: ""
          - arch: arm64
            goarch: arm64
            goarm: ""
            gomips: ""
          - arch: armv7
            goarch: arm
            goarm: "7"
            gomips: ""
          - arch: mipsle
            goarch: mipsle
            goarm: ""
            gomips: softfloat
    steps:
      - name: Checkout (for the patch)
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Clone reF1nd sing-box @ v1.14.3-reF1nd
        run: |
          set -e
          git clone --filter=blob:none https://github.com/reF1nd/sing-box.git src
          cd src
          git checkout v1.14.3-reF1nd

      - name: Apply clash proxy-providers patch
        run: |
          set -e
          cd src
          git apply ../tools/sing-box-patches/002-support-clash-proxy-providers-1.14.3-reF1nd.patch

      - name: Build static binary (CGO_ENABLED=0, musl-free)
        working-directory: src
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GODEBUG: checklinkname=0
        run: |
          set -e
          go build -trimpath -o "../sing-box-${{ matrix.arch }}" \
            -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,with_musl" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=1.14.3-reF1nd' -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -s -w -buildid=" \
            ./cmd/sing-box

      - name: Verify build
        run: |
          set -e
          f="sing-box-${{ matrix.arch }}"
          file "$f"
          ./$f version | head -n1

      - name: Upload sing-box artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.arch }}
          path: sing-box-${{ matrix.arch }}

  # ===========================================================================
  # 3) 打包 zip + 独立 IPK/APK + 内核 tar.gz，并发布到 Release
  # ===========================================================================
  package:
    name: Package and Release
    needs: [luci, core]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for install.sh / README)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build per-architecture ZIPs
        run: |
          set -e
          version="${{ inputs.tag }}"
          echo "version=$version"
          for arch in amd64 arm64 armv7 mipsle; do
            d="homeproxy-deploy-$arch-$version"
            mkdir -p "$d"
            cp -f "artifacts/luci-ipk/luci-app-homeproxy.ipk" "$d/"
            cp -f "artifacts/sing-box-$arch/sing-box-$arch"        "$d/sing-box"
            cp -f deploy/install.sh                                "$d/"
            cp -f deploy/README.md                                 "$d/"
            chmod 0755 "$d/install.sh" "$d/sing-box"
            ( cd "$d" && zip -r "../$d.zip" . )
            ls -la "$d.zip"
          done

      - name: Build core tarballs for runtime auto-update
        run: |
          set -e
          VER="1.14.3-reF1nd"
          # amd64（基线二进制，兼容所有 x86_64，含 x86-64-v3）
          cp -f "artifacts/sing-box-amd64/sing-box-amd64" sing-box
          tar -czf "sing-box-${VER}-linux-amd64-musl.tar.gz" sing-box
          # amd64v3 候选：复用同一基线二进制（update_core.sh 优先尝试 v3 名，失败回退到上面的 amd64）
          cp -f "sing-box-${VER}-linux-amd64-musl.tar.gz" "sing-box-${VER}-linux-amd64v3-musl.tar.gz"
          # arm64
          cp -f "artifacts/sing-box-arm64/sing-box-arm64" sing-box
          tar -czf "sing-box-${VER}-linux-arm64-musl.tar.gz" sing-box
          rm -f sing-box
          ls -la sing-box-${VER}-*.tar.gz

      - name: Prepare release body
        run: |
          {
            printf 'HomeProxy 一体化部署包（luci + 打补丁 reF1nd 内核）\n'
            printf '编译时间：%s\n' "$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')"
            printf '\n包含：luci-app-homeproxy(.ipk) + sing-box(1.14.3-reF1nd, 打补丁) + install.sh\n'
            printf '架构：amd64 / arm64 / armv7 / mipsle（按路由器 uname -m 选对应 zip）\n'
            if [ -n "${{ inputs.description }}" ]; then
              printf '\n%s\n' "${{ inputs.description }}"
            fi
          } >release_body.md
          sed -i -e '/./,$!d' release_body.md
          sed -i -e :a -e '/^\n*$/{$d;N;}; /\n$/ba' release_body.md

      - name: Stage standalone luci packages
        run: |
          set -e
          cp -f "artifacts/luci-ipk/luci-app-homeproxy.ipk" ./luci-app-homeproxy.ipk
          cp -f "artifacts/luci-apk/luci-app-homeproxy.apk" ./luci-app-homeproxy.apk
          ls -la luci-app-homeproxy.*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ inputs.tag }}
          name: Deploy ${{ inputs.tag }}
          body_path: release_body.md
          files: |
            homeproxy-deploy-*.zip
            luci-app-homeproxy.ipk
            luci-app-homeproxy.apk

      - name: Publish patched core to auto-update release (v1.14.3-reF1nd)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.14.3-reF1nd
          name: sing-box core 1.14.3-reF1nd (patched)
          body: "打补丁的 reF1nd sing-box 内核（clash proxy-providers 补丁），供 luci-app-homeproxy 运行时「更新内核」自动下载。REFIND_REPO=weicaixian86/luci-app-homeproxy"
          files: sing-box-1.14.3-reF1nd-*.tar.gz
