name: Build & Release All-in-One

# 一体化构建与发布（只跑这一个 workflow 即覆盖全部安装方式）：
#   - guard job：发布前用 git ls-remote --tags 与 gh release view 校验，拒绝覆盖同名 tag/Release（需求 4.3.3）
#   - luci job（matrix）：用 OpenWrt SDK 分别编译
#       · OpenWrt 24.10.0 的 .ipk（opkg 安装）
#       · OpenWrt 25.12.0 的 .apk（apk 安装）
#     两者均含中文 lmo；独立产物随 Release 发布，可直接 opkg/apk 安装。
#   - core job（matrix）：clone reF1nd/sing-box @ v1.14.3-reF1nd，打补丁，Go 交叉编译
#     多架构静态内核（amd64 / arm64 / armv7 / mipsle）
#   - package job：只发一个 Release，tag 即输入版本号（如 0.1.01），包含：
#       · 每架构一个一体化 zip（luci 包 + 内核 + install.sh + README）
#       · 独立 luci-app-homeproxy_<ver>-all.ipk / .apk
#       · sing-box-1.14.3-refind_<版本>-linux-{amd64,amd64v3,arm64,armv7,mipsle}-musl.tar.gz
#     构建时会把 update_core.sh 的 REFIND_TAG 改写为该 Release 标签，
#     使「更新内核」按钮从同一个 Release 自动下载打补丁内核。
#     内核二进制报告的版本为 1.14.3-reF1nd_<发布版本>（如 1.14.3-reF1nd_0.1.3），
#     用于在 LuCI「核心版本」区分官方 reF1nd 原版与本仓库打补丁的构建。
#
# 触发：手动（workflow_dispatch）填版本号（如 0.1.01；建议不带 v 前缀）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（例如 2.0.0；不需要 v 前缀）"
        required: true
        type: string
      description:
        description: "Release 描述（可选，默认留空）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  # ===========================================================================
  # 0) 发布前校验：拒绝覆盖同名 Git tag 或同名 Release（需求 4.3.3）
  #    luci 与 core 均依赖本 job，tag 重复时在数秒内全局失败，不浪费构建资源
  # ===========================================================================
  guard:
    name: Reject existing tag / release
    runs-on: ubuntu-latest
    steps:
      - name: Check tag and release do not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${{ inputs.tag }}"
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --tags "$repo_url" "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Git tag '$tag' already exists in ${GITHUB_REPOSITORY}; refusing to overwrite (需求 4.3.3)"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release '$tag' already exists in ${GITHUB_REPOSITORY}; refusing to overwrite (需求 4.3.3)"
            exit 1
          fi
          echo "OK: tag '$tag' does not exist yet; proceeding"

  # ===========================================================================
  # 1) 编译 luci 包（matrix：24.10 IPK + 25.12 APK，均含中文 lmo）
  # ===========================================================================
  luci:
    name: Build luci ${{ matrix.name }}
    # 依赖 core：内核 sha256 要 sed 进 update_core.sh（内置完整性校验），
    # 而压缩包只在 core job 打一次包（tar 含 mtime，重复打包 sha256 会变）。
    needs: [guard, core]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: IPK (OpenWrt 24.10.0)
            sdk_url: https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ext: ipk
          - name: APK (OpenWrt 25.12.0)
            sdk_url: https://downloads.openwrt.org/releases/25.12.0/targets/x86/64/openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ext: apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zstd

      - name: Locate package source directory
        id: pkgdir
        run: |
          set -e
          makefile="$(mktemp)"
          found=""
          while IFS= read -r candidate; do
            tr -d '\r' <"$candidate" >"$makefile"
            if grep -q '^PKG_NAME:=luci-app-homeproxy[[:space:]]*$' "$makefile"; then
              found="$(cd "$(dirname "$candidate")" && pwd)"
              break
            fi
          done < <(find . -name Makefile -type f)
          if [ -z "$found" ]; then
            echo "::error::no Makefile with PKG_NAME:=luci-app-homeproxy found"
            exit 1
          fi
          echo "dir=$found" >>"$GITHUB_OUTPUT"
          echo "package source directory: $found"

      - name: Update package version from tag
        id: version
        run: |
          set -e
          pkg_dir="${{ steps.pkgdir.outputs.dir }}"
          tag="${{ inputs.tag }}"
          version="${tag#v}"; version="${version#V}"
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$version/" "$pkg_dir/Makefile"
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" "$pkg_dir/Makefile"
          # 单一 Release 方案：把运行时内核下载标签改写为本次发布标签（tag 原样保留），
          # 使「更新内核」从同一个 Release 拉取打补丁内核。
          sed -i "s|^REFIND_TAG=.*|REFIND_TAG=\"$tag\"|" "$pkg_dir/root/etc/homeproxy/scripts/update_core.sh"
          grep -E '^PKG_(VERSION|RELEASE):=' "$pkg_dir/Makefile"
          grep -E '^REFIND_TAG=' "$pkg_dir/root/etc/homeproxy/scripts/update_core.sh"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Download core checksums
        uses: actions/download-artifact@v4
        with:
          pattern: core-sha-*
          merge-multiple: true

      # 把本次发布的内核 sha256 注入 update_core.sh 的内置常量表。
      # 「更新内核」下载后就能本地校验完整性，不再依赖镜像或 Release 附带的
      # 校验文件（两者若走同一镜像，被一起替换就形同虚设）。
      - name: Inject core checksums into update_core.sh
        run: |
          set -e
          pkg_dir="${{ steps.pkgdir.outputs.dir }}"
          script="$pkg_dir/root/etc/homeproxy/scripts/update_core.sh"
          [ -f "$script" ] || { echo "::error::update_core.sh not found: $script"; exit 1; }
          for arch in amd64 arm64 armv7 mipsle; do
            f="sha256-${arch}.txt"
            [ -f "$f" ] || { echo "::error::missing checksum artifact for ${arch} (${f})"; exit 1; }
            digest="$(awk '{print $1}' "$f")"
            if [ "${#digest}" -ne 64 ]; then
              echo "::error::bad checksum for ${arch}: ${digest}"
              exit 1
            fi
            key="$(printf '%s' "$arch" | tr '[:lower:]' '[:upper:]')"
            sed -i "s|^CORE_SHA256_${key}=\".*\"|CORE_SHA256_${key}=\"${digest}\"|" "$script"
            # amd64v3 是 amd64 包的字节副本，校验值相同
            if [ "$arch" = "amd64" ]; then
              sed -i "s|^CORE_SHA256_AMD64V3=\".*\"|CORE_SHA256_AMD64V3=\"${digest}\"|" "$script"
            fi
          done
          grep -E '^CORE_SHA256_' "$script"

      - name: Download and extract SDK (${{ matrix.name }})
        run: |
          set -e
          sdk_url="${{ matrix.sdk_url }}"
          sdk_rel="${sdk_url#*downloads.openwrt.org}"
          MIRRORS="https://mirror-03.infra.openwrt.org https://mirrors.kernel.org/openwrt https://ftp.halifax.rwth-aachen.de/openwrt https://downloads.openwrt.org https://openwrt.proxy.ustclug.org https://mirrors.ustc.edu.cn/openwrt https://mirrors.tuna.tsinghua.edu.cn/openwrt"
          got=0
          for base in $MIRRORS; do
            url="${base}${sdk_rel}"
            echo "-> trying SDK mirror: $url"
            if curl -fsSL --http1.1 --connect-timeout 30 --max-time 900 \
                 --retry 3 --retry-delay 5 --retry-all-errors \
                 "$url" -o sdk.tar.zst; then
              echo "downloaded from $base"
              got=1
              break
            fi
            echo "failed from $base, trying next mirror"
            rm -f sdk.tar.zst
          done
          [ "$got" = "1" ] || { echo "::error::all SDK mirrors failed"; exit 1; }
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Build luci package
        working-directory: sdk
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install luci
          cp -r "${{ steps.pkgdir.outputs.dir }}" package/luci-app-homeproxy
          chmod 0755 package/luci-app-homeproxy/root/etc/init.d/* \
                     package/luci-app-homeproxy/root/etc/homeproxy/scripts/* 2>/dev/null || true
          echo "CONFIG_PACKAGE_luci-app-homeproxy=m" >> .config
          echo 'CONFIG_DOWNLOAD_MIRRORS="https://mirror-03.infra.openwrt.org https://mirrors.kernel.org/openwrt https://ftp.halifax.rwth-aachen.de/openwrt https://mirrors.tuna.tsinghua.edu.cn/openwrt"' >> .config
          make defconfig
          grep -E '^CONFIG_PACKAGE_luci-app-homeproxy=' .config
          make package/luci-app-homeproxy/compile V=s -j"$(nproc)"
          # 把编译出的中文 lmo 塞进 root/ 树，重编主包使其随 root/ 一起打包
          LMO="$(find build_dir -name 'homeproxy.zh-cn.lmo' | head -n1)"
          [ -n "$LMO" ] || { echo "::error::homeproxy.zh-cn.lmo not found in build_dir"; exit 1; }
          mkdir -p package/luci-app-homeproxy/root/usr/lib/lua/luci/i18n
          cp -f "$LMO" package/luci-app-homeproxy/root/usr/lib/lua/luci/i18n/homeproxy.zh-cn.lmo
          make package/luci-app-homeproxy/clean
          make package/luci-app-homeproxy/compile V=s -j"$(nproc)"

      - name: Collect ${{ matrix.ext }}
        run: |
          set -e
          ext="${{ matrix.ext }}"
          version="${{ steps.version.outputs.version }}"
          src="$(find sdk/bin -type f -name "luci-app-homeproxy*.${ext}" | head -n1)"
          [ -n "$src" ] || { echo "::error::luci .${ext} not found"; exit 1; }
          out="luci-app-homeproxy_${version}-all.${ext}"
          cp -f "$src" "$out"
          ls -la "$out"

      - name: Upload luci ${{ matrix.ext }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-${{ matrix.ext }}
          path: luci-app-homeproxy_*-all.${{ matrix.ext }}

  # ===========================================================================
  # 2) 编译打补丁的 reF1nd 内核（多架构）
  # ===========================================================================
  core:
    name: Build sing-box ${{ matrix.arch }}
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            goarm: ""
            gomips: ""
          - arch: arm64
            goarch: arm64
            goarm: ""
            gomips: ""
          - arch: armv7
            goarch: arm
            goarm: "7"
            gomips: ""
          - arch: mipsle
            goarch: mipsle
            goarm: ""
            gomips: softfloat
    env:
      # 国内可达的 Go 模块代理（goproxy.cn 优先），并关闭 HTTP/2 客户端，
      # 规避 proxy.golang.org 并发下载大模块时偶发的
      # "stream error: INTERNAL_ERROR; received from peer" 下载中断。
      GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct
      GOSUMDB: "off"
      GODEBUG: checklinkname=0,http2client=0
    steps:
      - name: Checkout (for the patch)
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Clone reF1nd sing-box @ v1.14.3-reF1nd
        run: |
          set -e
          git clone --filter=blob:none https://github.com/reF1nd/sing-box.git src
          cd src
          git checkout v1.14.3-reF1nd

      - name: Apply sing-box patches
        run: |
          set -e
          cd src
          for p in ../tools/sing-box-patches/*.patch; do
            echo "==> applying $p"
            git apply "$p"
          done

      - name: Download Go modules (retry on transient proxy errors)
        working-directory: src
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            echo "==> go mod download attempt $i"
            if go mod download; then
              echo "MODULE_DOWNLOAD_OK"
              break
            fi
            echo "download attempt $i failed, retrying in 8s..."
            sleep 8
          done
          go mod verify || true

      - name: Build static binary (CGO_ENABLED=0, musl-free)
        working-directory: src
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          set -e
          # 内核版本串 = <reF1nd 基础版本>_<插件版本>（如 1.14.3-reF1nd_0.1.3）。
          # 后缀用于在 LuCI「核心版本」里区分官方 reF1nd 原版与本仓库打补丁的构建。
          # update_core.sh 的 ensure_core 只比对下划线前的基础版本，因此该后缀
          # 不会破坏「已是最新即跳过下载」的逻辑，也不会用官方原版覆盖补丁内核。
          ver="${{ inputs.tag }}"
          ver="${ver#v}"; ver="${ver#V}"
          [ -n "$ver" ] || ver="dev"
          echo "core version string: 1.14.3-reF1nd_${ver}"
          go build -trimpath -o "../sing-box-${{ matrix.arch }}" \
            -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,with_musl" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=1.14.3-reF1nd_${ver}' -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -s -w -buildid=" \
            ./cmd/sing-box

      - name: Verify build
        run: |
          set -e
          f="sing-box-${{ matrix.arch }}"
          file "$f"
          ./$f version | head -n1

      # 内核压缩包只在这里打一次包：tar/gzip 不是可复现的（含 mtime），
      # 若在不同 job 各打一次，两次的 sha256 会不一致，内置校验值就对不上。
      # 因此 tarball + sha256 都在这里产出，luci job 把 sha256 sed 进
      # update_core.sh，package job 直接复用这个 tarball 上传 Release。
      - name: Package core tarball and checksum
        run: |
          set -e
          arch="${{ matrix.arch }}"
          ver="${{ inputs.tag }}"
          ver="${ver#v}"; ver="${ver#V}"
          [ -n "$ver" ] || ver="dev"
          VER="1.14.3-refind"
          cp -f "sing-box-${arch}" sing-box
          tar -czf "sing-box-${VER}_${ver}-linux-${arch}-musl.tar.gz" sing-box
          rm -f sing-box
          digest="$(sha256sum "sing-box-${VER}_${ver}-linux-${arch}-musl.tar.gz" | awk '{print $1}')"
          if [ "${#digest}" -ne 64 ]; then
            echo "::error::unexpected sha256 output for ${arch}: ${digest}"
            exit 1
          fi
          printf '%s\n' "$digest" > "sha256-${arch}.txt"
          echo "${arch} tarball sha256: ${digest}"
          ls -la "sing-box-${VER}_${ver}-linux-${arch}-musl.tar.gz"

      - name: Upload core binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-bin-${{ matrix.arch }}
          path: sing-box-${{ matrix.arch }}

      - name: Upload core tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-tar-${{ matrix.arch }}
          path: sing-box-1.14.3-refind_*-linux-${{ matrix.arch }}-musl.tar.gz

      - name: Upload core checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-sha-${{ matrix.arch }}
          path: sha256-${{ matrix.arch }}.txt

  # ===========================================================================
  # 3) 打包 zip + 独立 IPK/APK + 内核 tar.gz，并发布到 Release
  # ===========================================================================
  package:
    name: Package and Release
    needs: [luci, core]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for install.sh / README)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build per-architecture ZIPs
        run: |
          set -e
          tag="${{ inputs.tag }}"
          version="${tag#v}"; version="${version#V}"
          echo "version=$version"
          for arch in amd64 arm64 armv7 mipsle; do
            # 命名与 luci 包（luci-app-homeproxy_<ver>-all.ipk）一致：版本号在前、
            # 架构在后，用下划线分隔 —— README 与 deploy/README.md 都按这个名字
            # 写命令，用连字符会让用户照文档下载 404。
            d="homeproxy-deploy_${version}-${arch}"
            mkdir -p "$d"
            cp -f artifacts/luci-ipk/luci-app-homeproxy_*-all.ipk "$d/"
            cp -f artifacts/luci-apk/luci-app-homeproxy_*-all.apk "$d/"
            cp -f "artifacts/core-bin-$arch/sing-box-$arch"        "$d/sing-box"
            cp -f deploy/install.sh                                "$d/"
            cp -f deploy/README.md                                 "$d/"
            chmod 0755 "$d/install.sh" "$d/sing-box"
            ( cd "$d" && zip -r "../$d.zip" . )
            ls -la "$d.zip"
          done

      # tarball 已在 core job 打好包（含 sha256），这里只做收集 + amd64v3 副本，
      # 不再重新打包：tar/gzip 含 mtime，重打一次 sha256 就和注入的常量对不上。
      - name: Collect core tarballs for runtime auto-update
        run: |
          set -e
          VER="1.14.3-refind"
          tag="${{ inputs.tag }}"
          version="${tag#v}"; version="${version#V}"
          for arch in amd64 arm64 armv7 mipsle; do
            src="artifacts/core-tar-${arch}/sing-box-${VER}_${version}-linux-${arch}-musl.tar.gz"
            [ -f "$src" ] || { echo "::error::missing core tarball: $src"; exit 1; }
            cp -f "$src" "./sing-box-${VER}_${version}-linux-${arch}-musl.tar.gz"
          done
          # amd64v3 候选：字节副本，与 amd64 校验值相同（update_core.sh 优先试 v3 名，失败回退 amd64）
          cp -f "sing-box-${VER}_${version}-linux-amd64-musl.tar.gz" "sing-box-${VER}_${version}-linux-amd64v3-musl.tar.gz"
          # 顺手把校验值汇总成一个文件随 Release 发布，便于手工核对
          : > "sha256sums-${version}.txt"
          for arch in amd64 arm64 armv7 mipsle; do
            printf '%s  sing-box-%s_%s-linux-%s-musl.tar.gz\n' \
              "$(awk '{print $1}' "artifacts/core-sha-${arch}/sha256-${arch}.txt")" \
              "$VER" "$version" "$arch" >> "sha256sums-${version}.txt"
          done
          cat "sha256sums-${version}.txt"
          ls -la sing-box-${VER}_*.tar.gz

      - name: Prepare release body
        run: |
          {
            printf '编译时间：%s（北京时间，UTC+8）\n' "$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
            if [ -n "${{ inputs.description }}" ]; then
              printf '\n%s\n' "${{ inputs.description }}"
            fi
          } >release_body.md
          sed -i -e '/./,$!d' release_body.md
          sed -i -e :a -e '/^\n*$/{$d;N;}; /\n$/ba' release_body.md

      - name: Stage standalone luci packages
        run: |
          set -e
          cp -f artifacts/luci-ipk/luci-app-homeproxy_*-all.ipk ./
          cp -f artifacts/luci-apk/luci-app-homeproxy_*-all.apk ./
          ls -la luci-app-homeproxy_*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body_path: release_body.md
          files: |
            homeproxy-deploy*.zip
            luci-app-homeproxy_*-all.ipk
            luci-app-homeproxy_*-all.apk
            sing-box-1.14.3-refind_*.tar.gz
            sha256sums-*.txt
